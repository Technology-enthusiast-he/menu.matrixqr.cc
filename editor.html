<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Editor - Menu Studio | MatrixQR</title>
    
    <!-- 谷歌字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 静态编译样式与图标库 -->
    <link rel="stylesheet" href="/dist/output.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
    <!-- 导出与二维码辅助库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg-warm: #FDFBF7;
            --text-main: #2C2A29;
            --text-muted: #8C8275;
            --accent-clay: #D97757;
            --accent-green: #3A4D39;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-warm);
            color: var(--text-main);
        }
        .font-serif-warm { font-family: 'Lora', serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">

    <!-- 顶部导航栏 -->
    <header class="py-4 px-6 border-b border-[#2C2A29]/5 bg-white/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="/" class="flex items-center gap-2">
                <span class="w-3.5 h-3.5 rounded-full bg-[#D97757]"></span>
                <span class="font-serif-warm font-bold text-xl tracking-tight text-[#2C2A29]">Menu Studio</span>
            </a>

            <!-- 核心导出工具栏 -->
            <div class="flex items-center gap-3">
                <button id="btn-export-pdf" class="px-3.5 py-2 rounded-lg bg-[#2C2A29]/5 hover:bg-[#2C2A29]/10 text-[#2C2A29] text-xs font-semibold flex items-center gap-1.5 transition-all">
                    <i data-lucide="download" class="w-4 h-4"></i> Export PDF
                </button>
                <button id="btn-generate-qr" class="px-4 py-2 rounded-lg bg-[#D97757] hover:bg-[#b85e41] text-white text-xs font-semibold flex items-center gap-1.5 transition-all shadow-sm">
                    <i data-lucide="qr-code" class="w-4 h-4"></i> Generate QR Code
                </button>
            </div>
        </div>
    </header>

    <!-- 主工作区：左侧编辑控制，右侧实时 3D 预览 -->
    <main class="max-w-7xl mx-auto px-6 py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- 左侧编辑面板 -->
        <div class="lg:col-span-5 space-y-6 bg-white p-6 rounded-2xl shadow-sm border border-[#2C2A29]/5">
            <div>
                <h2 class="text-lg font-bold font-serif-warm text-[#2C2A29] mb-1">Select Template</h2>
                <div class="grid grid-cols-2 gap-2 mt-3" id="template-selector">
                    <button onclick="switchTemplate('modern-bistro')" class="p-3 border rounded-xl text-left hover:border-[#D97757] transition-all text-xs font-medium">
                        ✨ Modern Bistro
                    </button>
                    <button onclick="switchTemplate('japanese-dining')" class="p-3 border rounded-xl text-left hover:border-[#D97757] transition-all text-xs font-medium">
                        🍣 Japanese Dining
                    </button>
                </div>
            </div>

            <hr class="border-[#2C2A29]/5">

            <!-- 表单区域 -->
            <div class="space-y-4">
                <h2 class="text-lg font-bold font-serif-warm text-[#2C2A29]">Menu Info</h2>
                <div>
                    <label class="block text-xs font-medium text-[#8C8275] mb-1">Store Name</label>
                    <input type="text" id="input-store-name" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:border-[#D97757]">
                </div>
                <div>
                    <label class="block text-xs font-medium text-[#8C8275] mb-1">Tagline</label>
                    <input type="text" id="input-tagline" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:border-[#D97757]">
                </div>
            </div>
        </div>

        <!-- 右侧 Live 3D 预览区 -->
        <div class="lg:col-span-7 flex justify-center sticky top-24">
            <div id="menu-preview-card" data-tilt data-tilt-max="5" data-tilt-glare data-tilt-max-glare="0.1" class="w-full max-w-md p-8 rounded-2xl shadow-xl transition-all duration-300">
                <div class="text-center space-y-1 mb-8">
                    <h1 id="preview-store-name" class="text-3xl font-bold tracking-tight"></h1>
                    <p id="preview-tagline" class="text-xs opacity-75 uppercase tracking-widest"></p>
                </div>

                <div id="preview-categories" class="space-y-6">
                    <!-- 动态注入菜品列表 -->
                </div>
            </div>
        </div>

    </main>

    <!-- 二维码生成弹窗 -->
    <div id="qr-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-white p-6 rounded-2xl max-w-sm w-full text-center space-y-4">
            <h3 class="font-serif-warm font-bold text-lg">Your Menu QR Code</h3>
            <div id="qrcode-container" class="flex justify-center py-2"></div>
            <p class="text-xs text-[#8C8275]">Scan to view live digital menu on any device.</p>
            <button onclick="closeQrModal()" class="w-full py-2 bg-[#2C2A29] text-white text-xs font-semibold rounded-lg">Close</button>
        </div>
    </div>

    <!-- 交互脚本 -->
    <script>
        let currentTemplate = 'modern-bistro';
        let currentData = JSON.parse(JSON.stringify(MENU_TEMPLATES['modern-bistro']));

        // 从 URL 参数获取默认选中的模板
        const urlParams = new URLSearchParams(window.location.search);
        const templateParam = urlParams.get('template');
        if (templateParam && MENU_TEMPLATES[templateParam]) {
            currentTemplate = templateParam;
            currentData = JSON.parse(JSON.stringify(MENU_TEMPLATES[templateParam]));
        }

        const previewCard = document.getElementById('menu-preview-card');
        const storeNameInput = document.getElementById('input-store-name');
        const taglineInput = document.getElementById('input-tagline');

        function renderPreview() {
            // 应用样式
            previewCard.className = `w-full max-w-md p-8 rounded-2xl shadow-xl transition-all duration-300 ${currentData.styles.bgClass} ${currentData.styles.textClass} ${currentData.styles.fontClass}`;
            
            // 填充文字
            document.getElementById('preview-store-name').textContent = currentData.data.storeName;
            document.getElementById('preview-tagline').textContent = currentData.data.tagline;

            // 填充菜品分类
            const categoriesContainer = document.getElementById('preview-categories');
            categoriesContainer.innerHTML = '';

            currentData.data.categories.forEach(cat => {
                const catEl = document.createElement('div');
                catEl.className = 'space-y-3';
                catEl.innerHTML = `
                    <h3 class="text-sm font-bold uppercase tracking-wider border-b pb-1" style="border-color: ${currentData.styles.accentColor}">${cat.name}</h3>
                    <div class="space-y-2">
                        ${cat.items.map(item => `
                            <div class="flex justify-between items-start text-xs">
                                <div>
                                    <div class="font-bold">${item.name}</div>
                                    <div class="opacity-70 text-[10px]">${item.desc}</div>
                                </div>
                                <div class="font-bold">${item.price}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
                categoriesContainer.appendChild(catEl);
            });
        }

        function switchTemplate(templateId) {
            if (MENU_TEMPLATES[templateId]) {
                currentTemplate = templateId;
                currentData = JSON.parse(JSON.stringify(MENU_TEMPLATES[templateId]));
                storeNameInput.value = currentData.data.storeName;
                taglineInput.value = currentData.data.tagline;
                renderPreview();
            }
        }

        // 双向绑定输入框
        storeNameInput.addEventListener('input', (e) => {
            currentData.data.storeName = e.target.value;
            renderPreview();
        });
        taglineInput.addEventListener('input', (e) => {
            currentData.data.tagline = e.target.value;
            renderPreview();
        });

        // 二维码生成
        document.getElementById('btn-generate-qr').onclick = () => {
            const qrContainer = document.getElementById('qrcode-container');
            qrContainer.innerHTML = '';
            new QRCode(qrContainer, {
                text: window.location.href,
                width: 160,
                height: 160
            });
            document.getElementById('qr-modal').classList.remove('hidden');
            document.getElementById('qr-modal').classList.add('flex');
        };

        function closeQrModal() {
            document.getElementById('qr-modal').classList.remove('flex');
            document.getElementById('qr-modal').classList.add('hidden');
        }

        // PDF 导出逻辑
        document.getElementById('btn-export-pdf').onclick = () => {
            const element = document.getElementById('menu-preview-card');
            html2pdf().from(element).save(`${currentData.data.storeName}-Menu.pdf`);
        };

        window.onload = function() {
            if (typeof lucide !== 'undefined') lucide.createIcons();
            storeNameInput.value = currentData.data.storeName;
            taglineInput.value = currentData.data.tagline;
            renderPreview();
            if (typeof VanillaTilt !== 'undefined') {
                VanillaTilt.init(document.querySelectorAll("[data-tilt]"));
            }
        }
    </script>
</body>
</html>
